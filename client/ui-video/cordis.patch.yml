# @mydsh/ui-video 的 bundle patch 层（见 ui-notify 的同名文件说明）。
#
# 注意：本包只是浏览器半边（把消息里的本地媒体链接换成播放器）。播放地址
# `/mydsh-media/<路径>` 由主机层插件提供（mydsh 仓库的 host/media.ts，带
# 媒体扩展名白名单 + Origin 校验 + Range 支持），不在本 npm 包内 ——
# 没装主机路由时播放器会渲染出来但取不到数据。见 README。
